name: Normalize initial commit metadata

on:
  workflow_run:
    workflows: ['Refresh ocean sources']
    types: [completed]

permissions: {}

jobs:
  normalize:
    if: github.repository == 'liutianbabushuijue-web/ocean-pool' && github.event.workflow_run.head_branch == 'main' && github.run_number == 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize only the verified initial publication commits
        shell: bash
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
          UPDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          expected_ref="$(git rev-parse HEAD)"
          test "$(git rev-parse "$UPDATE_SHA^")" = '154a788130ecdb0fc36104629a615b1465dc1c90'
          git merge-base --is-ancestor "$UPDATE_SHA" HEAD
          test "$(git rev-list --count "$UPDATE_SHA..HEAD")" -le 1
          if test "$expected_ref" != "$UPDATE_SHA"; then
            test "$(git rev-parse HEAD^)" = "$UPDATE_SHA"
            test "$(git log -1 --format=%ae)" = '41898282+github-actions[bot]@users.noreply.github.com'
            test "$(git log -1 --format=%s)" = 'Update public ocean source data'
          fi
          previous_tree="$(git rev-parse 'HEAD^{tree}')"
          git filter-branch --env-filter '
            case "$GIT_AUTHOR_EMAIL" in
              *@users.noreply.github.com) ;;
              *) export GIT_AUTHOR_EMAIL="307004628+liutianbabushuijue-web@users.noreply.github.com" ;;
            esac
            case "$GIT_COMMITTER_EMAIL" in
              *@users.noreply.github.com) ;;
              *) export GIT_COMMITTER_EMAIL="307004628+liutianbabushuijue-web@users.noreply.github.com" ;;
            esac
          ' -- main
          test "$(git rev-parse 'HEAD^{tree}')" = "$previous_tree"
          python - <<'PY'
          import subprocess
          emails = subprocess.check_output(['git','log','--format=%ae%n%ce','main']).decode().splitlines()
          assert emails and all(email.endswith('@users.noreply.github.com') for email in emails)
          print('Verified anonymous email metadata throughout the initial main history.')
          PY
          git push --force-with-lease="refs/heads/main:$expected_ref" origin HEAD:refs/heads/main
