name: Publish reader to Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh ocean sources]
    types: [completed]

permissions: {}

concurrency:
  group: ocean-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.ENABLE_PAGES == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the static reader entry
        run: test -f site/index.html && test -f site/data.json
      - name: Configure Pages without enabling it automatically
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload only the reader directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish the artifact
        id: deployment
        uses: actions/deploy-pages@v4

